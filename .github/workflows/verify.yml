name: Verify row validator
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-interlis-row-validator-plugin
      artifacts: >-
        [{"file":"assemblies/plugin/target/hop-interlis-row-validator-plugin-*.zip"}]
      validation-command: |
        python3 scripts/check-distribution.py
        hop_dir="$(mktemp -d)"
        if ! curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
          https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$hop_dir/hop.zip"; then
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$hop_dir/hop.zip"
        fi
        echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  $hop_dir/hop.zip" | sha512sum -c -
        unzip -q "$hop_dir/hop.zip" -d "$hop_dir"
        python3 scripts/run-e2e.py --hop-home "$hop_dir/hop"
    secrets: inherit
