name: Verify row validator
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-interlis-row-validator-plugin
      artifacts: >-
        [{"file":"assemblies/plugin/target/hop-interlis-row-validator-plugin-*.zip"}]
      validation-command: |
        python3 scripts/check-distribution.py
        python3 -m unittest discover -s scripts -p test_run_e2e.py
        python3 scripts/run-e2e.py
    secrets: inherit
