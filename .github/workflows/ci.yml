name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, verify]
    uses: edigonzales/hop-plugin-ci/.github/workflows/publish.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      repository-kind: snapshot
      verified-artifact-name: hop-interlis-row-validator-plugin-canonical
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_PASSWORD }}
